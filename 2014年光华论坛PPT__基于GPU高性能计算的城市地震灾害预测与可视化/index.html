                       " id="js_content"><p>准确预测城市地震灾害并加以真实感可视化对城市抗震防灾具有重要意义。本报告介绍了如何基于GPU高性能计算，实现城市区域建筑群震害的精细化模拟和高真实展示。本PPT在2014年上海同济大学光华论坛上做了汇报。</p><p><br></p><p><img data-s="300,640" data-type="png" data-src="http://mmbiz.qpic.cn/mmbiz/uX3ebeLIgssRErbRgiaazI2dsb9p3yRLmHxibLDpMNoVAtahzicmNCqlqoNq8wYrZmkibmvFb91T5KV6P42ib7E71mA/0?wx_fmt=png" style="" data-ratio="0.75" data-w="" src="./assets/17687879648980.809327508002241.jpg"></p><p><img data-s="300,640" data-type="png" data-src="http://mmbiz.qpic.cn/mmbiz/uX3ebeLIgssRErbRgiaazI2dsb9p3yRLmGXUwvSic70ZibHUVhsRfYq0jVUdNTDvRvAXOThZI0CygozvsbI9wprxw/0?wx_fmt=png" style="" data-ratio="0.75" data-w="" src="./assets/17687879649720.5679693617730254.jpg"></p><p><img data-s="300,640" data-type="png" data-src="http://mmbiz.qpic.cn/mmbiz/uX3ebeLIgssRErbRgiaazI2dsb9p3yRLmWjCNj8KCSSlEL54W0P8qKibsxGNEHvfEHYOf42gGcDQZLqphopc7vag/0?wx_fmt=png" style="" data-ratio="0.75" data-w="" src="./assets/17687879650460.17464011297033122.jpg"></p><p><img data-s="300,640" data-type="png" data-src="http://mmbiz.qpic.cn/mmbiz/uX3ebeLIgssRErbRgiaazI2dsb9p3yRLmCicib4PKibo1fQ2oGIu4EsIdksyf41OibWibfKjT8UEobf4iawZQnlVc8XiaQ/0?wx_fmt=png" style="" data-ratio="0.75" data-w="" src="./assets/17687879651140.8644686195162338.jpg"></p><p><img data-s="300,640" data-type="png" data-src="http://mmbiz.qpic.cn/mmbiz/uX3ebeLIgssRErbRgiaazI2dsb9p3yRLmtdKc5ehCicxGfomqrkz3e5CmQUACRfich3vibI6mZA01DWOq21A1ibw5vQ/0?wx_fmt=png" style="" data-ratio="0.75" data-w="" src="./assets/17687879651850.8351159264324696.jpg"></p><p><img data-s="300,640" data-type="png" data-src="http://mmbiz.qpic.cn/mmbiz/uX3ebeLIgssRErbRgiaazI2dsb9p3yRLmibewjWPuuiaWwyBCm1wDFJD9p3HpRMMy7Hs81UZr9h3NSsHdSqmYjtZw/0?wx_fmt=png" style="" data-ratio="0.75" data-w="" src="./assets/17687879652560.4277110574649058.jpg"></p><p><img data-s="300,640" data-type="png" data-src="http://mmbiz.qpic.cn/mmbiz/uX3ebeLIgssRErbRgiaazI2dsb9p3yRLmiaPs5S2wgicS3w0qmfotE3GicOmuKic6g8zcGiahsZxZyzzmy5TPP3WOgUg/0?wx_fmt=png" st
